apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-bankapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-bankapp

  template:
    metadata:
      labels:
        app: ai-bankapp

    spec:
      containers:
      - name: ai-bankapp
        image: manoj289/ai-bankapp:latest
        imagePullPolicy: Always

        env:
        - name: MYSQL_HOST
          value: mysql-service

        - name: MYSQL_PORT
          value: "3306"

        - name: MYSQL_DATABASE
          value: bankappdb

        - name: MYSQL_USER
          value: root

        - name: MYSQL_PASSWORD
          value: "Test@123"

        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: ai-bankapp-service

spec:
  type: NodePort

  selector:
    app: ai-bankapp

  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
